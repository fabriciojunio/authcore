name: CI/CD Pipeline

# Validar alterações antes da promoção de homologação para produção.
on:
  push:
    branches: ["produção", "homologação"]
  pull_request:
    branches: ["produção", "homologação"]

# Cada job pede só o que usa; o padrão é apenas ler o repositório.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # O script de telemetria do @scarf/scarf (vem com o Swagger UI) não roda no CI.
  SCARF_ANALYTICS: 'false'

jobs:
  # Lint e verificacao de tipos (backend + frontend)
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Backend type check
        run: npx tsc --noEmit
        working-directory: backend

      - name: Backend ESLint
        run: npm run lint --workspace=backend

      - name: Frontend type check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Frontend ESLint
        run: npm run lint --workspace=frontend

  # Testes automatizados com Postgres e Redis reais
  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: enterprise_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Segredos e senhas abaixo existem só neste banco descartável do CI.
      - name: Run tests with coverage
        run: npm run test:coverage --workspace=backend -- --runInBand
        env:
          AUTHCORE_POSTGRES_TEST: '1'
          NODE_ENV: test
          JWT_ACCESS_SECRET: test-secret-that-is-at-least-64-characters-long-for-testing-only
          JWT_REFRESH_SECRET: test-refresh-secret-that-is-at-least-64-chars-long-for-testing
          ENCRYPTION_KEY: test-encryption-key-32chars!!
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: enterprise_test
          DB_USER: test_user
          DB_PASSWORD: test_password
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          APP_NAME: EnterpriseTest
          EMAIL_FROM: test@test.com
          SMTP_HOST: localhost
          SMTP_USER: test
          SMTP_PASSWORD: test
          ALLOWED_ORIGINS: http://localhost:3000

      - name: Frontend tests
        run: npm test --workspace=frontend

      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  # Build de producao (garante que backend e frontend compilam)
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build backend and frontend
        run: npm run build

  # O front no Chromium, contra o build de produção e os cabeçalhos da Vercel.
  e2e:
    name: Frontend end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Playwright
        run: npx playwright test
        working-directory: frontend

      - name: Traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7

  # A imagem do front é construída e posta no ar para conferir os cabeçalhos de verdade,
  # inclusive numa rota da SPA, que era onde o nginx os perdia.
  frontend-image:
    name: Frontend image (headers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: docker build -f docker/Dockerfile.frontend --target production -t authcore-web .

      - name: Run and check headers
        run: |
          docker run -d --name web -p 8080:8080 --read-only --tmpfs /tmp --cap-drop ALL authcore-web
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://localhost:8080/ && break; sleep 1; done
          docker exec web id -u | grep -vx 0
          for path in / /login /dashboard; do
            headers=$(curl -fsSI "http://localhost:8080$path")
            echo "$headers" | grep -i "^content-security-policy: default-src 'none'"
            echo "$headers" | grep -i "^strict-transport-security:"
            echo "$headers" | grep -i "^x-frame-options: DENY"
            echo "$headers" | grep -i "^x-content-type-options: nosniff"
          done
          curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/.env | grep -x 403

  # Auditoria de seguranca das dependencias
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # A barreira é sobre dependência de producao, que e a que sobe junto com
      # o servidor. O que trava a entrega aqui e falha alcancavel por quem
      # acessa a aplicacao.
      - name: npm audit das dependencias de producao (high and above)
        run: npm audit --omit=dev --audit-level=high

      # A árvore de desenvolvimento também barra a partir de alta: o vitest trazia
      # o tinypool com prototype pollution até execução de código no CI. O que sobra
      # abaixo disso é o deepmerge do Jest, de severidade baixa.
      - name: npm audit da arvore completa (high and above)
        run: npm audit --audit-level=high

  # Publicacao da imagem Docker apenas no branch padrao.
  #
  # A condicao apontava para refs/heads/produção, mesmo erro que o gatilho do
  # fluxo tinha: o branch padrao deste repositorio e produção. O job aparecia
  # na definicao e era sempre pulado, sem nada avisando.
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test, build, security, e2e, frontend-image]
    if: github.ref == 'refs/heads/produção'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # O driver padrao do Docker no runner nao sabe exportar cache, e a etapa
      # de build pede cache do GitHub Actions. Sem o buildx a execucao morre em
      # "Cache export is not supported for the docker driver", que nao diz nada
      # sobre o Dockerfile e manda procurar defeito no lugar errado.
      - name: Preparar o buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # A raiz, e nao ./backend: o lockfile do workspace vive aqui.
          context: .
          file: ./docker/Dockerfile.backend
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

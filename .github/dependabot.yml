version: 2
updates:
  # Versões novas só são propostas depois de 7 dias, quando um pacote comprometido costuma já ter sido retirado.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Menor e correção vão num PR só por ecossistema. Um PR por pacote estourou
    # o limite diário de deploys da Vercel em 05/11/2026.
    groups:
      menores-e-correcoes:
        update-types: ["minor", "patch"]
    cooldown:
      default-days: 7
    ignore:
      # Os tipos acompanham a versão principal do Node usada no CI e na imagem.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: "docker"
    directories: ["/docker"]
    schedule:
      interval: "weekly"
    # Menor e correção vão num PR só por ecossistema. Um PR por pacote estourou
    # o limite diário de deploys da Vercel em 05/11/2026.
    groups:
      menores-e-correcoes:
        update-types: ["minor", "patch"]
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Menor e correção vão num PR só por ecossistema. Um PR por pacote estourou
    # o limite diário de deploys da Vercel em 05/11/2026.
    groups:
      menores-e-correcoes:
        update-types: ["minor", "patch"]
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci(deps)"

reason = "glob ReDoS: triggered only by an attacker-controlled glob pattern. Here glob comes transitively through Jest (dev), swagger-jsdoc and typeorm, where the pattern is static developer config (entity and spec paths), never request input. The fix is glob 14, a major jump that breaks Jest (glob 7 API) and typeorm."

